[tox]
envlist = py39,py310,py311,py312,py313,ruff,docs,twinecheck
isolated_build = True


[testenv]
usedevelop = True
deps =
    pytest
commands = pytest


[testenv:docs]
basepython = python3
skip_install = true
deps = -r docs/requirements.txt
commands =
    sphinx-build -q -W -b html -d {envtmpdir}/doctrees docs {envtmpdir}/html


[testenv:twinecheck]
basepython = python3
skip_install = true
deps =
    twine
    build
commands =
    python -m build --sdist --outdir {envtmpdir}/dist
    twine check {envtmpdir}/dist/*


[testenv:ruff]
basepython = python3
deps = ruff
skip_install = true
commands = ruff check gaftools/ tests/ setup.py
